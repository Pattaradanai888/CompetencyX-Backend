[project]
name = "competencyx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.4",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "drf-spectacular>=0.28.0",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.9",
    "pyyaml>=6.0",
    "whitenoise>=6.8.0",
]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.11.1",
    "pytest-xdist>=3.6.1",
    "ruff>=0.14.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
minversion = "8.3"
# Coverage is opt-in to keep the dev loop fast; for a coverage run use:
#   .venv\Scripts\python.exe -m pytest -n auto --cov=. --cov-report=xml:coverage/coverage.xml --cov-report=term-missing
# (pytest-cov combines the xdist workers' data, so parallel runs report full coverage; CI runs exactly this)
# Pass -n 0 to disable parallelism for debugging single tests.
addopts = "-p no:cacheprovider --basetemp=.codex-pytest-basetemp --ds=config.settings.test --reuse-db --import-mode=importlib -n auto"
python_files = ["tests.py", "test_*.py"]
testpaths = ["accounts", "api", "roadmaps", "assessments", "config", "simulation"]
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
norecursedirs = [
    ".codex-pytest-tmp",
    ".codex-pytest-tmp-*",
    ".codex-pytest-basetemp",
    ".codex-python-temp",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".tmp",
    ".uv-cache",
    ".venv",
    "build",
    "coverage",
    "dist",
]

[tool.coverage.run]
relative_files = true
source = ["accounts", "api", "assessments", "config", "roadmaps", "simulation"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    ".venv/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.ruff]
line-length = 150
target-version = "py312"
extend-exclude = ["*/migrations/*.py", "static_root/*"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    "ASYNC",
    "S",
    "BLE",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "DJ",
    "EM",
    "FA",
    "ISC",
    "ICN",
    "G",
    "INP",
    "PIE",
    "T20",
    "PT",
    "RSE",
    "RET",
    "SIM",
    "TID",
    "TC",
    "INT",
    "PTH",
    "ERA",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    "PERF",
    "RUF",
]
ignore = ["S101", "COM812", "TRY003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S105", "S106", "S107", "PLR2004", "PT009"]
"**/tests/*.py" = ["S105", "S106", "S107", "PLR2004", "PT009"]
"**/test_*.py" = ["S105", "S106", "S107", "S311", "PLR2004", "PT009"]
# Persona/Monte-Carlo simulation legitimately uses non-cryptographic RNG.
"simulation/personas.py" = ["S311"]
"**/migrations/*.py" = ["ALL"]
"manage.py" = ["INP001", "PLC0415", "EM101"]
"config/settings/__init__.py" = ["F403"]
"config/settings/base.py" = ["S105"]
"config/settings/runtime.py" = ["F403", "F405"]
"config/settings/test.py" = ["F403", "F405", "S105"]

[tool.ruff.lint.isort]
lines-after-imports = 2
force-single-line = false

[tool.ruff.format]
quote-style = "single"
