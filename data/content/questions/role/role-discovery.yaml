# Role-discovery question catalog (provenance schema).
# Signals are ordinal levels (primary/secondary/contrast) converted to numbers
# by roadmaps/seeds.py via SIGNAL_STRENGTH_WEIGHTS; construct is the dimension
# the item measures. See docs/scoring-methodology.md for the authoring checklist
# and review workflow. review.status=draft means the rationale has not yet been
# human-verified against the cited sources.
role_questions:
- code: role-swebok-01-requirements
  item_group: core
  question_type: likert_5
  prompt: Under tight sprint deadlines with fuzzy requirements, I stop to run problem-discovery workshops even if it risks delaying our initial coding start
    date.
  translations:
    th:
      prompt: ในช่วงท้าย Sprint ที่เวลาบีบคั้นแต่ Requirement ยังคลุมเครือ ฉันจะเลือกจัดเวิร์กช็อปเพื่อถอดโจทย์ปัญหาให้เคลียร์ แม้จะต้องแลกกับการเริ่มต้นเขียนโค้ดล่าช้ากว่ากำหนดก็ตาม
  construct: requirements
  agree_signals:
    requirements: primary
    people_product: secondary
  disagree_signals:
    architecture: contrast
  rationale: Choosing discovery workshops over an early coding start is the KA1 elicitation trade-off; disagreement signals a schema-first architectural
    instinct.
  sources:
  - swebok:
      ka: KA1
      topic: Requirements Elicitation
  review:
    status: draft
    date: '2026-07-11'
  display_order: 1
- code: role-swebok-02-architecture
  item_group: core
  question_type: likert_5
  prompt: Before coding a complex system, I refuse to start building screens until I've mapped the database schema and integration boundaries, even if project
    managers demand a quick UI demo.
  translations:
    th:
      prompt: ก่อนจะเริ่มพัฒนาคีย์เวิร์กที่มีความซับซ้อน ฉันยืนกรานที่จะไม่ทำหน้าจอ UI จนกว่าจะออกแบบโครงสร้าง Database และ Interface ร่วมระหว่างระบบให้จบ
        แม้จะถูกเร่งรัดให้ทำเดโมสวย ๆ ไปอวดโชว์ก็ตาม
  construct: architecture
  agree_signals:
    architecture: primary
    backend_platform: secondary
  disagree_signals:
    design: secondary
  rationale: Mapping schema and integration boundaries before building screens is architectural significant-decision work (KA2).
  sources:
  - swebok:
      ka: KA2
      topic: Architectural Structures and Views
  review:
    status: draft
    date: '2026-07-11'
  display_order: 2
- code: role-swebok-03-design
  item_group: core
  question_type: likert_5
  prompt: When designing a new user onboarding, I map the complete user journey and interaction states before writing any code, even when pressed to use
    pre-built components immediately.
  translations:
    th:
      prompt: เมื่อต้องออกแบบระบบ Onboarding ใหม่ ฉันเลือกที่จะลงแรงวาด User Journey และ Interaction Flow ให้ครบทุกเส้นทางก่อนเริ่มเขียนโค้ด แม้จะโดนกดดันให้รีบแกะ
        Component สำเร็จรูปมาใช้เลยก็ตาม
  construct: design
  agree_signals:
    design: primary
    people_product: secondary
  disagree_signals:
    construction: secondary
  rationale: Mapping journeys and interaction states before code is detailed interaction design (KA3); disagreement favors building directly.
  sources:
  - swebok:
      ka: KA3
      topic: User Interface Design
  review:
    status: draft
    date: '2026-07-11'
  display_order: 3
- code: role-swebok-04-construction
  item_group: core
  question_type: likert_5
  prompt: I would rather take on high-volume coding tickets in isolation than sit through project planning and alignment meetings, even if it leads to integration
    friction later.
  translations:
    th:
      prompt: ฉันยอมเลือกปิดตัวลุยโค้ดทีเดียวหลาย ๆ ทิกเก็ต ดีกว่าต้องแบ่งเวลาไปเข้าประชุมประสานแผนงานหรือวางแผนสปรินต์ แม้จะเสี่ยงทำให้ระบบประกอบกันยากขึ้นในภายหลังก็ตาม
  construct: construction
  agree_signals:
    construction: primary
    application_build: secondary
  disagree_signals:
    management: secondary
    leadership_process: secondary
  rationale: Preferring high-volume coding over planning meetings is a pure construction-orientation signal (KA4) traded against management work.
  sources:
  - swebok:
      ka: KA4
      topic: Practical Considerations
  review:
    status: draft
    date: '2026-07-11'
  display_order: 4
- code: role-swebok-05-testing
  item_group: core
  question_type: likert_5
  prompt: I refuse to ship features without full unit and integration test coverage, even when product managers pressure us to bypass testing to meet a
    critical marketing deadline.
  translations:
    th:
      prompt: ฉันยืนกรานที่จะไม่ปล่อย Feature ที่ไม่มี Test Coverage ครอบคลุม (Unit & Integration Tests) แม้จะถูก PM กดดันอย่างหนักให้ปล่อยของด่วนเพื่อทันแคมเปญการตลาดก็ตาม
  construct: testing
  agree_signals:
    testing: primary
    quality: secondary
    leadership_process: contrast
  disagree_signals:
    construction: secondary
  rationale: Refusing to ship without coverage under deadline pressure is the KA5 testing-discipline trade-off.
  sources:
  - swebok:
      ka: KA5
      topic: Test Levels
  review:
    status: draft
    date: '2026-07-11'
  display_order: 5
- code: role-swebok-06-operations
  item_group: core
  question_type: likert_5
  prompt: I spend substantial time configuring application logging and alert dashboards before launching a feature, even if the team views it as post-release
    overhead.
  translations:
    th:
      prompt: ฉันเลือกเสียเวลานั่งเซ็ตระบบ Log และ Alert Dashboard ให้ละเอียดล่วงหน้าก่อนเอาโค้ดขึ้นระบบจริง แม้เพื่อนในทีมจะมองว่าเป็นงานงอกส่วนเกินที่ค่อยทำทีหลังปล่อยของไปแล้วก็ได้
  construct: operations
  agree_signals:
    operations: primary
    operations_security: secondary
  disagree_signals:
    requirements: contrast
  rationale: Investing in logging and alert dashboards pre-launch is operations/observability work (KA6).
  sources:
  - swebok:
      ka: KA6
      topic: Operational Monitoring
  review:
    status: draft
    date: '2026-07-11'
  display_order: 6
- code: role-swebok-07-maintenance
  item_group: core
  question_type: likert_5
  prompt: I prefer refactoring a legacy module to make it stable and maintainable over building a greenfield service from scratch, even if refactoring gets
    zero stakeholder recognition.
  translations:
    th:
      prompt: ฉันเลือกที่จะจมอยู่กับการรื้อ Refactor โค้ดมรดก (Legacy Module) ให้มั่นคงและคลีนขึ้น ดีกว่าการสร้างโปรเจกต์ใหม่ด้วยเทคโนโลยีใหม่ ๆ แม้งานรื้อนี้จะไม่มีสเตกโฮลเดอร์เห็นเป็นผลงานเลยก็ตาม
  construct: maintenance
  agree_signals:
    maintenance: primary
    quality: secondary
  disagree_signals:
    construction: secondary
  rationale: Preferring stabilizing refactors of legacy modules over greenfield building is the KA7 maintenance disposition.
  sources:
  - swebok:
      ka: KA7
      topic: Maintenance Categories
  review:
    status: draft
    date: '2026-07-11'
  display_order: 7
- code: role-swebok-08-configuration-management
  item_group: core
  question_type: likert_5
  prompt: I spend time locking down version boundaries, Docker setups, and CI/CD pipelines even when developers complain that strict configurations slow
    down their local workflows.
  translations:
    th:
      prompt: ฉันยอมเสียเวลาควบคุม Version, จัดแจง Docker และล็อก CI/CD Pipeline ให้เป็นระเบียบสุด ๆ แม้คนในทีมจะบ่นว่าความเข้มงวดนี้ทำให้ขยับตัวแก้บั๊กใน
        Local ได้ช้าลงก็ตาม
  construct: configuration_management
  agree_signals:
    configuration_management: primary
    operations_security: secondary
  disagree_signals:
    application_build: contrast
  rationale: Locking down versions, containers, and pipelines despite developer friction is SCM discipline (KA8).
  sources:
  - swebok:
      ka: KA8
      topic: Configuration Control
  review:
    status: draft
    date: '2026-07-11'
  display_order: 8
