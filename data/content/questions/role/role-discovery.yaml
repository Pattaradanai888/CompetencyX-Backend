# Role-discovery question catalog (provenance schema).
# Thai (translations.th.prompt) is the Canonical Thai Wording; the English
# prompt is an adaptation. Every item names one activity or one domain
# (Single-Axis Question) in plain words a student can answer from preference.
# Signals are ordinal levels (primary/secondary/contrast) converted to numbers
# by roadmaps/seeds.py via SIGNAL_STRENGTH_WEIGHTS; construct is the dimension
# the item measures. Core and tie-break items form one pool that the adaptive
# flow picks from (ADR-0006); item_group and discriminates_between record what
# an item was written to separate. See docs/scoring-methodology.md for the
# authoring checklist and review workflow. review.status=draft means a person
# has not yet approved the wording.
role_questions:
- code: role-rd-requirements
  item_group: core
  question_type: likert_5
  prompt: I like to find out first what the people who will use something really need.
  translations:
    th:
      prompt: ชอบถามให้ชัดก่อนว่าคนที่จะใช้งานต้องการอะไรจริง ๆ
  construct: requirements
  agree_signals:
    requirements: primary
    people_product: secondary
  disagree_signals:
    construction: contrast
  rationale: Eliciting real needs before building is the KA1 activity; disagreeing leans toward building first.
  sources:
  - swebok:
      ka: KA1
  review:
    status: draft
    date: '2026-10-21'
  display_order: 1
