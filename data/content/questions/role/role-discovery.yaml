  item_group: core
  question_type: likert_5
  prompt: Under tight sprint deadlines with fuzzy requirements, I stop to run problem-discovery
    workshops even if it risks delaying our initial coding start date.
  translations:
    th:
      prompt: ในช่วงท้าย Sprint ที่เวลาบีบคั้นแต่ Requirement ยังคลุมเครือ ฉันจะเลือกจัดเวิร์กช็อปเพื่อถอดโจทย์ปัญหาให้เคลียร์
