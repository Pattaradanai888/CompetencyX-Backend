        UI จนกว่าจะออกแบบโครงสร้าง Database และ Interface ร่วมระหว่างระบบให้จบ แม้จะถูกเร่งรัดให้ทำเดโมสวย
        ๆ ไปอวดโชว์ก็ตาม
