role_questions:
  - code: role-primary-interest
    question_type: single_choice
    prompt: Which kind of work sounds most interesting right now?
    help_text: Choose the path you would most like to study first.
    difficulty: 1
    discrimination_score: 3.0
    display_order: 1
    options:
      - key: frontend
        label: Building browser interfaces
        display_order: 1
        role_signals: {frontend-engineer: 4}
      - key: backend
        label: Designing APIs and backend services
        display_order: 2
        role_signals: {backend-engineer: 4}
      - key: fullstack
        label: Shipping complete user-facing features across the stack
        display_order: 3
        role_signals: {full-stack-engineer: 4}
      - key: devops
        label: Automating deployments and operating infrastructure
        display_order: 4
        role_signals: {devops-engineer: 4}
      - key: data
        label: Transforming, modeling, and moving data
        display_order: 5
        role_signals: {data-engineer: 4}
      - key: mobile
        label: Building mobile applications and app experiences
        display_order: 6
        role_signals: {mobile-engineer: 4}
      - key: qa
        label: Improving quality with test strategy and automation
        display_order: 7
        role_signals: {qa-test-engineer: 4}
      - key: security
        label: Protecting systems and reducing security risk
        display_order: 8
        role_signals: {cybersecurity-engineer: 4}
  - code: role-preferred-problems
    question_type: single_choice
    prompt: Which kind of problems do you most enjoy solving?
    help_text: Choose the problem space you would keep returning to even when it gets hard.
    difficulty: 1
    discrimination_score: 2.7
    display_order: 2
    options:
      - key: ui-behavior
        label: User experience, flows, and interface behavior
        display_order: 1
        role_signals: {frontend-engineer: 3, full-stack-engineer: 2, mobile-engineer: 2}
      - key: service-logic
        label: APIs, business rules, and server-side logic
        display_order: 2
        role_signals: {backend-engineer: 3, full-stack-engineer: 2, data-engineer: 1}
      - key: reliability
        label: Release reliability, automation, and operational stability
        display_order: 3
        role_signals: {devops-engineer: 3, qa-test-engineer: 2, cybersecurity-engineer: 1}
      - key: data-systems
        label: Data structure, transformation, and analytical pipelines
        display_order: 4
        role_signals: {data-engineer: 3, backend-engineer: 1}
      - key: risk-defense
        label: Threats, misuse, and securing critical systems
        display_order: 5
        role_signals: {cybersecurity-engineer: 3, devops-engineer: 1}
  - code: role-working-style
    question_type: single_choice
    prompt: Which working style sounds the most satisfying?
    help_text: Pick the kind of outcomes you would most like to own.
    difficulty: 1
    discrimination_score: 2.6
    display_order: 3
    options:
      - key: visual-product
        label: Turning product ideas into polished screens and interactions
        display_order: 1
        role_signals: {frontend-engineer: 3, mobile-engineer: 2, full-stack-engineer: 1}
      - key: system-backbone
        label: Building the system backbone that powers features and integrations
        display_order: 2
        role_signals: {backend-engineer: 3, full-stack-engineer: 2, data-engineer: 1}
      - key: ship-safely
        label: Making delivery safer with tests, checks, and predictable releases
        display_order: 3
        role_signals: {qa-test-engineer: 3, devops-engineer: 2}
      - key: platform-security
        label: Hardening environments, access, and incident response
        display_order: 4
        role_signals: {cybersecurity-engineer: 3, devops-engineer: 1}

