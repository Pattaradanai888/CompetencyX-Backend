# Role x dimension relevance mapping — the human-edited derivation input for
# ROLE_PROFILE_WEIGHTS. Humans edit LEVELS and RATIONALES here; numbers are
# derived by `manage.py generate_role_weights` using meta.weight_ladder.
# See docs/scoring-methodology.md for level definitions and review workflow.
#
# Source reference shapes:
#   {swebok: {ka: KA1}}                 -> data/sources/swebok_v4_ka_reference.yaml
#   {roadmap_sh: {file: backend.json}}  -> data/upstream/roadmap_sh/manifest.yaml
#
# Only non-none cells are listed; an absent dimension means weight 0.
# This initial mapping was reverse-engineered from the previous hand-typed
# weights (rubric snap) — every cell is review.status: draft until a human
# has checked its rationale against the cited sources.

meta:
  rubric_version: 1
  weight_ladder:
    ka: {core: 1.0, supporting: 0.6, peripheral: 0.3}
    family: {primary: 1.0, secondary: 0.7}
    specialization: {defining: 1.0, shared: 0.7}

