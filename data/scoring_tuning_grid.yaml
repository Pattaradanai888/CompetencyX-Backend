# Scoring hyperparameter grid for `python manage.py tune_scoring`.
#
# Each key must be one of the tunable constants in simulation/engine.py
# (TUNABLE_PARAM_NAMES). The tuner runs the full cartesian product of all
# listed values.

# Thresholds are in vote units (each answer contributes +/-0.5 or +/-1.0
# per role), so margins land on multiples of 0.5.
grid:
  ROLE_DISCOVERY_MIN_SCORE_MARGIN: [1.5, 2.0, 2.5, 3.0, 3.5]
  ROLE_CONFIDENCE_FULL_MARGIN: [4.0, 5.0, 6.0]
